<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" font-family="Menlo, Consolas, monospace" font-size="13">
  <style>
    .box { fill: #f6f6f6; stroke: #333; stroke-width: 1.5; }
    .ok { fill: #e4f5e4; stroke: #2e7d32; stroke-width: 2; }
    .fail { fill: #fde2e2; stroke: #c0392b; stroke-width: 2; }
    .label { fill: #222; }
    .ok-label { fill: #1b5e20; font-weight: bold; }
    .fail-label { fill: #922; font-weight: bold; }
    .arrow { stroke: #555; stroke-width: 1.5; marker-end: url(#arrowhead); }
    .note { fill: #666; font-size: 11px; }
    .col-title { font-size: 15px; font-weight: bold; fill: #222; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555" />
    </marker>
  </defs>

  <text x="200" y="28" text-anchor="middle" class="col-title">이름변경 (rename) 플로우</text>
  <text x="580" y="28" text-anchor="middle" class="col-title">생성 (create) 플로우</text>

  <!-- LEFT column: rename -->
  <rect x="30" y="45" width="340" height="55" rx="6" class="box"/>
  <text x="200" y="68" text-anchor="middle" class="label">클라이언트 validateName(name)</text>
  <text x="200" y="86" text-anchor="middle" class="note">서버 왕복 없이 즉시 검증</text>

  <line x1="200" y1="100" x2="200" y2="135" class="arrow"/>

  <rect x="30" y="135" width="340" height="55" rx="6" class="box"/>
  <text x="200" y="158" text-anchor="middle" class="label">실패 시 catch(err)</text>
  <text x="200" y="176" text-anchor="middle" class="note">err.code로 메시지 조회</text>

  <line x1="200" y1="190" x2="200" y2="225" class="arrow"/>

  <rect x="30" y="225" width="340" height="65" rx="6" class="ok"/>
  <text x="200" y="250" text-anchor="middle" class="ok-label">"workspace는 사용할 수 없습니다"</text>
  <text x="200" y="270" text-anchor="middle" class="ok-label">정상 표시</text>

  <!-- RIGHT column: create -->
  <rect x="410" y="45" width="340" height="55" rx="6" class="box"/>
  <text x="580" y="68" text-anchor="middle" class="label">클라이언트 사전검증 (err.code 사용)</text>
  <text x="580" y="86" text-anchor="middle" class="note">통과하면 다음 단계로</text>

  <line x1="580" y1="100" x2="580" y2="135" class="arrow"/>

  <rect x="410" y="135" width="340" height="55" rx="6" class="box"/>
  <text x="580" y="158" text-anchor="middle" class="label">소켓으로 서버에 생성 요청</text>
  <text x="580" y="176" text-anchor="middle" class="note">서버가 다시 한번 검증</text>

  <line x1="580" y1="190" x2="580" y2="225" class="arrow"/>

  <rect x="410" y="225" width="340" height="55" rx="6" class="box"/>
  <text x="580" y="248" text-anchor="middle" class="label">서버 검증 실패 → 소켓 에러 이벤트</text>
  <text x="580" y="266" text-anchor="middle" class="note">에러 객체 필드: code</text>

  <line x1="580" y1="280" x2="580" y2="315" class="arrow"/>

  <rect x="410" y="315" width="340" height="65" rx="6" class="fail"/>
  <text x="580" y="338" text-anchor="middle" class="fail-label">handleMakeErrorSocket:</text>
  <text x="580" y="358" text-anchor="middle" class="fail-label">err.errorCode 읽음 (항상 undefined)</text>

  <line x1="580" y1="380" x2="580" y2="415" class="arrow"/>

  <rect x="410" y="415" width="340" height="65" rx="6" class="fail"/>
  <text x="580" y="438" text-anchor="middle" class="fail-label">메시지 매핑 실패 → fallback</text>
  <text x="580" y="458" text-anchor="middle" class="fail-label">"알 수 없는 오류가 발생했습니다"</text>

  <text x="400" y="505" text-anchor="middle" class="note">같은 검증 로직인데, 에러를 받는 핸들러가 읽는 필드명이 서로 달라서 결과가 갈렸다</text>
</svg>
