<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" font-family="Menlo, Consolas, monospace" font-size="14">
  <style>
    .box { fill: #f6f6f6; stroke: #333; stroke-width: 1.5; }
    .ok { fill: #e4f5e4; stroke: #2e7d32; stroke-width: 2; }
    .fail { fill: #fde2e2; stroke: #c0392b; stroke-width: 2; }
    .label { fill: #222; }
    .ok-label { fill: #1b5e20; }
    .fail-label { fill: #922; }
    .arrow { stroke: #555; stroke-width: 1.5; marker-end: url(#arrowhead); }
    .note { fill: #666; font-size: 12px; }
    .commit { fill: #fff3cd; stroke: #b8860b; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555" />
    </marker>
  </defs>

  <rect x="30" y="15" width="700" height="50" rx="6" class="box"/>
  <text x="380" y="45" text-anchor="middle" class="label">예약어 검증 로직 도입 (수년 전) — 이때는 err.code로 정상 동작</text>

  <line x1="380" y1="65" x2="380" y2="95" class="arrow"/>

  <rect x="30" y="95" width="700" height="65" rx="6" class="commit"/>
  <text x="380" y="118" text-anchor="middle" class="label">한참 뒤 어느 커밋: "이미지팩 생성 시 알 수 없는 오류" 수정</text>
  <text x="380" y="138" text-anchor="middle" class="note">GIS_500 케이스 하나 고치려다 err.code → err.errorCode로 필드명 전체 교체</text>
  <text x="380" y="153" text-anchor="middle" class="note">같은 함수 안 다른 조건문까지 같이 바뀜</text>

  <line x1="380" y1="160" x2="380" y2="195" class="arrow"/>

  <text x="205" y="215" text-anchor="middle" class="label" font-weight="bold">예약어 에러 핸들러</text>
  <text x="555" y="215" text-anchor="middle" class="label" font-weight="bold">GPU 에러 핸들러 (형제)</text>

  <line x1="380" y1="195" x2="205" y2="230" class="arrow"/>
  <line x1="380" y1="195" x2="555" y2="230" class="arrow"/>

  <rect x="55" y="230" width="300" height="60" rx="6" class="fail"/>
  <text x="205" y="255" text-anchor="middle" class="fail-label">err.errorCode 그대로 사용</text>
  <text x="205" y="275" text-anchor="middle" class="fail-label">fallback 없음 → 조용히 깨짐</text>

  <rect x="405" y="230" width="300" height="60" rx="6" class="ok"/>
  <text x="555" y="255" text-anchor="middle" class="ok-label">err?.errorCode || err?.code</text>
  <text x="555" y="275" text-anchor="middle" class="ok-label">fallback 있음 → 정상 동작</text>

  <line x1="205" y1="290" x2="205" y2="325" class="arrow"/>
  <line x1="555" y1="290" x2="555" y2="325" class="arrow"/>

  <rect x="30" y="325" width="700" height="55" rx="6" class="box"/>
  <text x="380" y="350" text-anchor="middle" class="label">클래스 → 함수형 컴포넌트 전면 리팩터링</text>
  <text x="380" y="368" text-anchor="middle" class="note">두 핸들러를 나란히 비교했으면 보였을 차이, 그대로 복사되어 넘어감</text>

  <line x1="380" y1="380" x2="380" y2="410" class="arrow"/>

  <rect x="30" y="410" width="700" height="55" rx="6" class="fail"/>
  <text x="380" y="435" text-anchor="middle" class="fail-label">이후 지금까지 방치 — 클라이언트 사전검증에 가려 잘 안 드러남</text>
  <text x="380" y="452" text-anchor="middle" class="note">사전검증을 우회하는 드문 경로(템플릿/자동생성 이름)로만 재현</text>
</svg>
