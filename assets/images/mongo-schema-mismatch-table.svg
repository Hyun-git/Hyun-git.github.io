<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="Menlo, Consolas, monospace" font-size="13">
  <style>
    .hdr { fill: #eee; stroke: #333; stroke-width: 1.5; }
    .row { fill: #fdfdfd; stroke: #999; stroke-width: 1; }
    .fail { fill: #fde2e2; }
    .label { fill: #222; }
    .hdr-label { fill: #222; font-weight: bold; }
    .fail-label { fill: #922; }
  </style>

  <rect x="20" y="15" width="720" height="35" class="hdr"/>
  <text x="90" y="38" class="hdr-label">컬렉션/필드</text>
  <text x="330" y="38" class="hdr-label">서비스 A 스키마</text>
  <text x="530" y="38" class="hdr-label">서비스 B/C 스키마</text>

  <rect x="20" y="50" width="720" height="55" class="row fail"/>
  <text x="30" y="72" class="label">region_info</text>
  <text x="330" y="72" class="fail-label">컬렉션명: region_info</text>
  <text x="530" y="72" class="fail-label">실제 DB: region_infos</text>
  <text x="30" y="94" class="label" font-size="11" fill="#666">→ 사실상 빈 컬렉션을 계속 조회</text>

  <rect x="20" y="105" width="720" height="45" class="row fail"/>
  <text x="30" y="127" class="label">container_run_log(s)</text>
  <text x="330" y="127" class="fail-label">container_run_log</text>
  <text x="530" y="127" class="fail-label">container_run_logs</text>
  <text x="30" y="143" class="label" font-size="11" fill="#666">→ 데이터가 두 컬렉션으로 갈라져 쌓임</text>

  <rect x="20" y="150" width="720" height="45" class="row fail"/>
  <text x="30" y="172" class="label">docker_info.uid</text>
  <text x="330" y="172" class="fail-label">unique 인덱스 있음</text>
  <text x="530" y="172" class="fail-label">인덱스 없음</text>
  <text x="30" y="188" class="label" font-size="11" fill="#666">→ 트래픽 증가 시 쿼리 저하, 원인 파악 어려움</text>

  <rect x="20" y="195" width="720" height="45" class="row fail"/>
  <text x="30" y="217" class="label">ideNotification.reportReason</text>
  <text x="330" y="217" class="fail-label">필드 있음</text>
  <text x="530" y="217" class="fail-label">필드 누락</text>
  <text x="30" y="233" class="label" font-size="11" fill="#666">→ 코드 리뷰에서 잘 안 걸리는 유형</text>

  <rect x="20" y="240" width="720" height="45" class="row fail"/>
  <text x="30" y="262" class="label">notification.state</text>
  <text x="330" y="262" class="fail-label">타입: Object</text>
  <text x="530" y="262" class="fail-label">실제 저장값: Boolean</text>
  <text x="30" y="278" class="label" font-size="11" fill="#666">→ 특정 케이스에서 ValidationError</text>
</svg>
