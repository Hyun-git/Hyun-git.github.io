<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="Menlo, Consolas, monospace" font-size="14">
  <style>
    .box { fill: #f6f6f6; stroke: #333; stroke-width: 1.5; }
    .ok { fill: #e4f5e4; stroke: #2e7d32; stroke-width: 2; }
    .commit { fill: #fff3cd; stroke: #b8860b; stroke-width: 1.5; }
    .label { fill: #222; }
    .ok-label { fill: #1b5e20; font-weight: bold; }
    .commit-label { fill: #7a5c00; font-weight: bold; }
    .note { fill: #666; font-size: 12px; }
    .arrow { stroke: #555; stroke-width: 1.5; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555" />
    </marker>
  </defs>

  <rect x="30" y="15" width="700" height="55" rx="6" class="box"/>
  <text x="380" y="38" text-anchor="middle" class="label">ToolCallLimitMiddleware — exitBehavior: 'continue'</text>
  <text x="380" y="56" text-anchor="middle" class="note">한도 초과분만 에러 메시지로 막고, throw는 절대 하지 않음</text>

  <line x1="380" y1="70" x2="380" y2="105" class="arrow"/>

  <rect x="30" y="105" width="700" height="55" rx="6" class="commit"/>
  <text x="380" y="128" text-anchor="middle" class="commit-label">보조 미들웨어 (배열상 앞쪽, afterModel은 역순 실행)</text>
  <text x="380" y="146" text-anchor="middle" class="note">차단 감지 시 throw 없이 개입</text>

  <line x1="380" y1="160" x2="380" y2="195" class="arrow"/>

  <rect x="30" y="195" width="700" height="55" rx="6" class="ok"/>
  <text x="380" y="218" text-anchor="middle" class="ok-label">return &#123; jumpTo: 'end', messages: [...] &#125;</text>
  <text x="380" y="236" text-anchor="middle" class="note">return 기반 정상 종료 — pregel commit 경로가 온전함</text>

  <line x1="380" y1="250" x2="380" y2="285" class="arrow"/>

  <rect x="30" y="285" width="700" height="60" rx="6" class="ok"/>
  <text x="380" y="310" text-anchor="middle" class="ok-label">체크포인트 손상 없음 → 같은 스레드로 후속 요청 정상 재개</text>
  <text x="380" y="328" text-anchor="middle" class="note">순차 호출 / 멀티툴 배치 두 시나리오 모두 검증 완료</text>
</svg>
